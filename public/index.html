<!doctype HTML>
<html>
    <head>
        <title>Home</title>
        <script>

          const myName = "hastings"  //<-- *CHANGE THIS*
          var myToken  // undefined, initially
          const pollMax = 5  // number of polls to make, before pausing
          var pollId, pollNum  // current polling params   
            
          async function init() {
          // Startup 
            myToken = setToken(myName)
            var token = await getToken()  // retrieve existing token, if any
            ping.disabled = checkToken(token)  // if it's mine, wait for other party
            await putToken()  // regardless, assert myToken; no poll
          }

          function checkToken(token) { 
          // Check whether token is mine
            return (token.user==myToken.user && token.agent==myToken.agent) 
          }

          function setToken(name) {
          // Establish initial User-Browser context - myself in this browser  
            const o = {}
            function guessBrowser() {
              const a = navigator.userAgent; console.log(a)
              var r = "Firefox"  // default, ff order important
              if (a.indexOf("Saf")>0) r = "Safari"
              if (a.indexOf("Chr")>0) r = "Chrome"
              if (a.indexOf("Edg")>0) r = "Edge"
              return r
            }
            o.user = name
            o.agent = guessBrowser()
            return o
          }
  
          async function getToken() { //console.log("at getToken")
          // Fetch most recent context from server 
          // https://stackoverflow.com/questions/62680847/how-to-wait-for-fetch-to-complete
            try {
             const response = await fetch('token.json')
             if (!response.ok) throw new Error(`Response status: ${response.status}`)
             const token = await response.json(); console.log("got", token)
             return token
            } catch (error) {
             console.error(error.message)
            } 
          }

          async function putToken(flag) { //console.log("at putToken")
          // Store my context to server
            const response = await fetch('token.json', 
             { method: "PUT", body: JSON.stringify(myToken),
               headers: {"Content-Type": "application/json"}}); 
              console.log("put", myToken)  // NB: always *my* token
              if (flag) setTimeout(rePoll, 1000)  // optionally, force first poll
          }
          function rePoll() {
          // Start a new polling sequence   
              pollSeq.innerHTML = " "; poll.hidden = true
              pollNum = pollMax 
              pollId = setInterval(poller, 2000)  // start the poller
          }
          async function poller() { //console.log("at poller)
          // Continue polling
            pollSeq.innerHTML += (pollNum +" ")  // count down   
            var token = await getToken(); 
            ping.disabled = checkToken(token); 
            if(--pollNum<=0 || !ping.disabled) {
              clearInterval(pollId); //console.log("cleared")
              poll.hidden = !ping.disabled  
            }
          }
        </script>
    </head>

    <body>
        <big><input type=button id=ping onClick="putToken(true)" value="Ping"></big>
        <span id=pollSeq> </span>
        <input type=button id=poll onClick="rePoll()" hidden=true value="Poll">
    </body>

</html>
